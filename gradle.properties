# Local proxy so dependency downloads reach Maven Central.
# Mirror of the http.proxy entry in .git/config - the same local proxy.
# If you switch proxy software or it moves ports, change it here too.
# Delete this file section when on a network that reaches Maven Central directly.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=16780
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=16780
